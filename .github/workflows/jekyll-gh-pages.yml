name: Build and deploy Cloud Whale
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          ruby tests/content_test.rb
          ruby scripts/prepare_library.rb
          ruby scripts/check_content.rb
          bundle exec ruby tests/discovery_check.rb
          for file in assets/js/*.js; do node --check "$file"; done
          node tests/redirects.cjs
          node --check tests/reading.cjs
          node --check tests/layouts.cjs
          node --check tests/fixtures/readers.cjs
      - name: Build and check project subdirectory URLs
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --baseurl /path-check --destination _site_check
          python scripts/check_site.py _site_check --baseurl /path-check
          rm -r _site_check
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          JEKYLL_ENV: production
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$SITE_ORIGIN" ]; then
            python -c 'import json, os; open(".deploy.yml", "w").write("url: " + json.dumps(os.environ["SITE_ORIGIN"]) + "\n")'
            bundle exec jekyll build --config _config.yml,.deploy.yml --baseurl "$BASE_PATH"
          else
            bundle exec jekyll build --baseurl ""
          fi
          python scripts/check_site.py _site --baseurl "$BASE_PATH"
      - name: Check reading interactions in Chromium
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          node tests/node_modules/playwright/cli.js install --with-deps chromium
          node tests/reading.cjs _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
