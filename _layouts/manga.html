---
layout: default
---
<article class="reading-page gallery-page"><a class="back-link" href="{{ '/works/' | relative_url }}">← 返回作品</a><header class="article-heading"><p class="eyebrow">{{ page.status | escape }}</p><h1>{{ page.title | escape }}</h1><p>{{ page.synopsis | escape }}</p></header><div class="reading-tools js-only"><button type="button" class="focus-toggle" aria-pressed="false">沉浸看图</button><button type="button" id="gallery-mode" aria-pressed="false">切换为逐页</button><div id="gallery-controls" hidden><button id="gallery-prev" type="button">上一页</button><span id="gallery-counter" aria-live="polite"></span><button id="gallery-next" type="button">下一页</button></div></div><div class="prose">{% include content.html %}</div><div id="gallery">{% for image in page.pages %}<figure><a href="{{ image | relative_url }}" target="_blank" rel="noopener" aria-label="放大第 {{ forloop.index }} 张图片"><img src="{{ image | relative_url }}" alt="{{ page.title | escape }} · 第 {{ forloop.index }} 张" width="560" height="420" loading="lazy"></a><figcaption>{% if forloop.index < 10 %}0{% endif %}{{ forloop.index }} / {{ page.pages.size }} · 点击放大 · 可缩放拖动</figcaption></figure>{% endfor %}</div>{% include giscus.html %}</article>
