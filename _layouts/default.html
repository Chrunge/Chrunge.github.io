<!doctype html>
<html lang="zh-CN" data-theme="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <script src="{{ '/assets/js/theme-init.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/themes.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/library.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/refresh.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/reader.css' | relative_url }}">
  {% include scripts.html %}
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  {% include header.html %}
  <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
  <button class="focus-exit" type="button" hidden>退出沉浸 <kbd>Esc</kbd></button>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</body>
</html>
