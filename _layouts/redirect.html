---
layout: default
---
<article class="reading-page"><h1>{{ page.title | escape }}</h1><p>{{ page.redirect_message | default: '这篇笔记已整理到作品书架。' | escape }}</p><a class="button primary" id="redirect-target"{% if page.preserve_query %} data-preserve-query="true"{% endif %} href="{{ page.target_url | relative_url }}">{{ page.redirect_label | default: '前往阅读 →' | escape }}</a></article>
<script src="{{ '/assets/js/redirect.js' | relative_url }}" defer></script>
