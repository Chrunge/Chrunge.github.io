# 部署后替换为真实的 owner/repository；此入口未配置前不启用。
backend:
  name: github
  repo: Chrunge/Chrunge.github.io
  branch: master
media_folder: assets/images/uploads
public_folder: /assets/images/uploads
collections:
  - name: posts
    label: 博客
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 日期, name: date, widget: datetime}
      - {label: 分类, name: category, widget: string}
      - {label: 标签, name: tags, widget: list, required: false}
      - {label: 简短摘要, name: description, widget: text}
      - {label: 正文, name: body, widget: markdown}
  - name: manga
    label: 画集
    folder: _manga
    create: true
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 状态, name: status, widget: string}
      - {label: 封面, name: cover, widget: image}
      - {label: 简介, name: synopsis, widget: text}
      - label: 图片
        name: pages
        widget: list
        field: {label: 图片, name: image, widget: image}
      - {label: 正文, name: body, widget: markdown, required: false}
  - name: novels
    label: 小说
    folder: _novels
    create: true
    fields:
      - {label: 标题, name: title, widget: string}
      - {label: 状态, name: status, widget: string}
      - {label: 作者, name: author, widget: string}
      - {label: 封面, name: cover, widget: image}
      - {label: 简介, name: synopsis, widget: text}
      - {label: 正文, name: body, widget: markdown}
