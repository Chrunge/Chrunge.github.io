<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="云海小鲸首页"><img src="{{ '/assets/images/mascot/mascot_main.png' | relative_url }}" width="48" height="40" alt=""><span>云海小鲸</span></a>
  <nav aria-label="主导航">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a>
    <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>博客</a>
    <a href="{{ '/works/' | relative_url }}" {% if page.url contains '/works/' or page.collection == 'manga' or page.collection == 'novels' %}aria-current="page"{% endif %}>作品</a>
    <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>关于</a>
  </nav>
  <div class="header-tools js-only">
    <details class="theme-picker">
      <summary aria-label="选择主题颜色">◐ <span>主题</span></summary>
      <div class="theme-panel"><p>给今天换一种颜色</p><div class="theme-options">
      {% for theme in site.data.themes %}
        <button type="button" class="theme-option" data-theme-value="{{ theme.id }}" data-avatar="{{ theme.avatar | relative_url }}" aria-pressed="false"><i class="swatch" data-theme="{{ theme.id }}" aria-hidden="true"></i><span>{{ theme.name }}</span></button>
      {% endfor %}
      </div><small>选择会保存在当前浏览器</small></div>
    </details>
    <button class="focus-toggle" type="button" aria-pressed="false" title="隐藏导航与装饰，专注于内容">沉浸</button>
  </div>
</header>
