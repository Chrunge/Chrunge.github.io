<title id="title">云海小鲸 · 内容与发布架构</title><desc id="desc">作者维护内容，由 GitHub Actions 运行 Jekyll 与链接检查，发布静态网站至 GitHub Pages，浏览器负责阅读偏好，可选连接 Giscus。</desc>
